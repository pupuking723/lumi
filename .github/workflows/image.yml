name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lumi-image-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/indulgeback/lumi
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: 807846450233-mov3vk9e12ucn9b27i3fvk9g2veutlkk.apps.googleusercontent.com
  DEPLOY_HOST: 216.128.159.73
  DEPLOY_DIR: /opt/lumi-pro

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public build config
        run: |
          test -n "${NEXT_PUBLIC_GOOGLE_CLIENT_ID}"
          test -n "${NEXT_PUBLIC_LUMI_LIVE_WS_URL}"
        env:
          NEXT_PUBLIC_LUMI_LIVE_WS_URL: wss://lumiai.club/v1/closy/live/gemini/ws

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_LUMI_LIVE_WS_URL=wss://lumiai.club/v1/closy/live/gemini/ws
            NEXT_PUBLIC_LUMI_LIVE_SESSION_PATH=/api/live/session
            NEXT_PUBLIC_LUMI_CHAT_PROXY_PATH=/api/chat/completions
            NEXT_PUBLIC_LUMI_UPLOAD_PROXY_PATH=/api/chat/attachments/upload
            NEXT_PUBLIC_API_BASE_URL=

  deploy:
    name: Deploy to test server
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull and restart Lumi
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             read -r ghcr_token
             printf '%s' \"\$ghcr_token\" | docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null
             unset ghcr_token
             cd '$DEPLOY_DIR'
             docker compose pull lumi
             docker compose up -d --force-recreate lumi
             docker image prune -f"
