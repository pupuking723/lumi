name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/indulgeback/lumi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_LUMI_LIVE_WS_URL=wss://lumiai.club/v1/closy/live/gemini/ws
            NEXT_PUBLIC_LUMI_LIVE_SESSION_PATH=/api/live/session
            NEXT_PUBLIC_LUMI_CHAT_PROXY_PATH=/api/chat/completions
            NEXT_PUBLIC_LUMI_UPLOAD_PROXY_PATH=/api/chat/attachments/upload
            NEXT_PUBLIC_API_BASE_URL=
